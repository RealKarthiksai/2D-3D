[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "room-recon"
version = "0.0.1"
description = "Room Scanner Part 4: 3D reconstruction (SfM, dense MVS, textured mesh, Gaussian Splatting, packaging)."
requires-python = ">=3.11,<3.13"
# torch is provided by the workspace extra (cpu | cu126 | cu130), not pinned here.
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "opencv-python>=5.0.0.93",
    "open3d==0.19.0",
    "pycolmap==4.2.1",
    "torch>=2.14",
    "gsplat==1.5.3",
    "torchmetrics[image]>=1.8",
    "plyfile>=1.1",
    "imageio>=2.37",
    "trimesh>=4.8",
    "pydantic>=2.14.3",
    "jsonschema>=4.26.0",
    "typer>=0.29.1",
]

