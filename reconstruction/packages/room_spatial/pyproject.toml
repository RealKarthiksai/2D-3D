[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "room-spatial"
version = "0.0.1"
description = "Room Scanner Part 3: spatial understanding (pose refinement, depth/scale, fusion, planes, room geometry)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "opencv-python>=5.0.0.93",
    "open3d==0.19.0",
    "pycolmap==4.2.1",
    "mcap>=1.6.0",
    "av>=15.0",
    "pydantic>=2.14.3",
    "jsonschema>=4.26.0",
    "typer>=0.29.1",
]

