# uv workspace for Room Scanner Part 3 (room_spatial) and Part 4 (room_recon).
# The two packages are independent: neither imports the other; they exchange data only
# through the documented SpatialMap folder format (see docs/).
[project]
name = "room-reconstruction-workspace"
version = "0.0.0"
requires-python = ">=3.11,<3.13"   # open3d 0.19 ships wheels for 3.11/3.12 only; 0.20.0 rejected: ScalableTSDFVolume returns empty meshes
dependencies = []

[project.optional-dependencies]
# Exactly one torch flavour must be chosen: `uv sync --extra cpu` or `uv sync --extra cu126`.
cpu = ["torch==2.14.1", "torchvision"]
cu126 = ["torch==2.14.1", "torchvision"]
cu130 = ["torch==2.14.1", "torchvision"]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.4"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }]]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
room-spatial = { workspace = true }
room-recon = { workspace = true }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
